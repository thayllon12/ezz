plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pastinha.joguinho'
    compileSdk 34

    defaultConfig {
        applicationId "com.pastinha.joguinho"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // audio e fonte precisam ficar sem compressao para openFd()
    androidResources {
        noCompress 'ogg', 'wav', 'ttf'
    }
}
